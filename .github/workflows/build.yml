name: Nachrichtenportal bauen & veröffentlichen

on:
  schedule:
    # GitHub-Cron läuft in UTC. 02:30 UTC = 03:30 Uhr (Winterzeit) bzw. 04:30 Uhr (Sommerzeit).
    # Geplante Läufe starten bei GitHub oft einige Minuten verspätet.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Seite erzeugen
        env:
          # Optional: DeepL-Schlüssel als Repository-Secret hinterlegen für bessere Übersetzungen.
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python build.py --config feeds.yaml --out public

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
